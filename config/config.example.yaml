configRoute: "~/.config"

clashApi:
  host: "127.0.0.1"
  port: 21090
  modeSyncIntervalMs: 0 # background Clash mode resync cadence; 0 disables automatic sync
  disableDefaultProfiles: false
  profiles:
    - name: "work"
      mode: "work"
      desc: "Optional extra Clash mode profile"

ruleSets:
  forceProxyPath: "sing-box/rules/force-proxy.json"
  forceDirectPath: "sing-box/rules/force-direct.json"
  autoProxyPath: "sing-box/rules/auto-proxy.json"
  autoDirectPath: "sing-box/rules/auto-direct.json"
  extraFiles:
    - name: "custom-bypass"
      path: "sing-box/rules/custom-bypass.json"
      description: "Optional extra editable rule-set"

diagnostics:
  enabled: true
  refreshIntervalMs: 180000
  requestTimeoutMs: 5000
  connection:
    ipv4:
      executable: "curl"
      args: ["-4", "-sS", "--noproxy", "*", "https://api.ipify.org"]
    timing:
      executable: "curl"
      args:
        - "-4"
        - "-sS"
        - "--noproxy"
        - "*"
        - "-o"
        - "/dev/null"
        - "-w"
        - "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n"
        - "https://www.gstatic.com/generate_204"
    dns:
      executable: "dig"
      args: ["-4", "+short", "TXT", "o-o.myaddr.l.google.com"]
    location:
      mode: "local_db" # disabled | local_db | dynamic_cache
      localDb:
        databasePath: "tunlet/GeoLite2-City.mmdb"
        asnDatabasePath: "tunlet/GeoLite2-ASN.mmdb"
        downloadUrl: ""
      dynamicCache:
        provider: "ipwhois"
        url: "https://ipwho.is/"
        cachePath: "tunlet/geoip-cache.json"
        baseRefreshDays: 14
        randomShiftDays: 3
        timeoutMs: 5000
        refreshOnStartup: false # startup/runtime refreshes stay read-only; startup may still bootstrap one missing cache entry for the current IP
        allowManualRefresh: true # enables the dedicated "Refresh location data" action

theme:
  qssPath: ""

editing:
  createBackup: true
  backupSuffix: ".bak"

tray:
  keepRunningWithoutWindow: true
  startHidden: false

logging:
  enabled: false
  level: "info" # info | warning | error
  textPath: "tunlet/logs/tunlet.log" # optional human-readable text sink
  jsonlPath: "tunlet/logs/tunlet.jsonl" # optional structured JSONL sink
  rotation:
    enabled: false # enable size-based rotation for both sinks
    maxFileBytes: 1048576 # rotate when appending the next entry would exceed this size
    keepFiles: 5 # number of rotated archives to keep per sink, not counting the active file

ui:
  textSelection:
    enableInformationalLabels: true
  keyboard:
    shortcuts:
      closeWindowPrimary: "Esc"
      closeWindowSecondary: "Q"
      nextPage: "Ctrl+Tab"
      previousPage: "Ctrl+Shift+Tab"
      pageMain: "1"
      pageRules: "2"
      pageSettings: "3"
      openModeSelector: "M"
      openRuleFileSelector: "R"
      refreshRuntime: "Ctrl+R"
      refreshLocationData: "Shift+F5"
      validateEditor: "Ctrl+Shift+V"
      saveEditor: "Ctrl+S"
      reloadEditor: "Ctrl+Shift+R"
