clashApi:
  host: "127.0.0.1"
  port: 21090
  profiles:
    - name: "work"
      mode: "work"
      desc: "Optional extra Clash mode profile"

ruleSets:
  forceProxyPath: "/home/user/.config/sing-box/rules/force-proxy.json"
  forceDirectPath: "/home/user/.config/sing-box/rules/force-direct.json"
  autoProxyPath: "/home/user/.config/sing-box/rules/auto-proxy.json"
  autoDirectPath: "/home/user/.config/sing-box/rules/auto-direct.json"
  extraFiles:
    - name: "custom-bypass"
      path: "/home/user/.config/sing-box/rules/custom-bypass.json"
      description: "Optional extra editable rule-set"

diagnostics:
  enabled: true
  refreshIntervalMs: 10000
  requestTimeoutMs: 5000
  connection:
    ipv4:
      executable: "curl"
      args: ["-4", "-sS", "--noproxy", "*", "https://api.ipify.org"]
    timing:
      executable: "curl"
      args:
        - "-4"
        - "-sS"
        - "--noproxy"
        - "*"
        - "-o"
        - "/dev/null"
        - "-w"
        - "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n"
        - "https://www.gstatic.com/generate_204"
    dns:
      executable: "dig"
      args: ["-4", "+short", "TXT", "o-o.myaddr.l.google.com"]
    location:
      enabled: true
      databasePath: "~/.config/tunlet/GeoLite2-City.mmdb"

theme:
  qssPath: ""

editing:
  createBackup: true
  backupSuffix: ".bak"
